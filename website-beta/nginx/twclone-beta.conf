# Static website only. The raw game TCP/TLS endpoint is a separate service and
# is never proxied through Cloudflare or Nginx.
server {
    listen 80;
    listen [::]:80;
    server_name twclone.impara.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name twclone.impara.co.uk;

    root /srv/twclone-site/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/twclone.impara.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twclone.impara.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
